<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business — Flashcards</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f0f4f8; --surface: #fff; --text: #1a202c; --muted: #718096;
    --accent: #4CAF50; --accent-dark: #2E7D32; --accent-light: #e8f5e9;
    --border: #e2e8f0; --flip-time: 0.5s; --radius: 1rem;
  }
  [data-theme="dark"] {
    --bg: #1a202c; --surface: #2d3748; --text: #e2e8f0; --muted: #a0aec0;
    --accent: #66bb6a; --accent-light: #1b5e20;
    --border: #4a5568;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    line-height: 1.6; padding: 2rem 1rem;
    transition: background .3s, color .3s;
  }

  .header {
    text-align: center; max-width: 48rem; margin: 0 auto 2.5rem;
  }
  .header h1 {
    font-size: clamp(1.5rem, 4vw, 2.2rem); font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header p { color: var(--muted); margin-top: .5rem; font-size: .95rem; }

  .tabs {
    display: flex; justify-content: center; gap: .5rem;
    flex-wrap: wrap; margin-bottom: 1.5rem;
  }
  .tabs button {
    padding: .4rem 1rem; border: 2px solid var(--border); border-radius: 2rem;
    background: var(--surface); color: var(--text); cursor: pointer;
    font-size: .8rem; font-weight: 600; transition: all .2s;
  }
  .tabs button:hover { border-color: var(--accent); color: var(--accent); }
  .tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .controls {
    display: flex; justify-content: center; gap: .75rem;
    flex-wrap: wrap; margin-bottom: 2rem;
  }
  .controls button {
    padding: .5rem 1.2rem; border: 1px solid var(--border); border-radius: 2rem;
    background: var(--surface); color: var(--text); cursor: pointer;
    font-size: .85rem; font-weight: 600; transition: all .2s;
  }
  .controls button:hover { border-color: var(--accent); color: var(--accent); }
  .controls button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .counter {
    text-align: center; color: var(--muted); font-size: .9rem; margin-bottom: 1.5rem;
  }

  .deck {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(22rem, 1fr));
    gap: 1.5rem; max-width: 74rem; margin: 0 auto; perspective: 1200px;
  }

  .card-wrapper { height: 26rem; cursor: pointer; }
  .card-wrapper.single-view { grid-column: 1 / -1; max-width: 36rem; margin: 0 auto; height: 30rem; }

  .card {
    position: relative; width: 100%; height: 100%;
    transition: transform var(--flip-time) ease;
    transform-style: preserve-3d;
  }
  .card-wrapper.flipped .card { transform: rotateY(180deg); }

  .card__face {
    position: absolute; inset: 0; backface-visibility: hidden;
    border-radius: var(--radius); padding: 1.5rem;
    display: flex; flex-direction: column;
    border: 1px solid var(--border); overflow-y: auto;
    background: var(--surface);
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
    transition: box-shadow .2s;
  }
  .card-wrapper:hover .card__face { box-shadow: 0 8px 24px rgba(0,0,0,.12); }

  .card__front { justify-content: center; align-items: center; text-align: center; }
  .card__back { transform: rotateY(180deg); }

  .card__number {
    position: absolute; top: 1rem; left: 1.2rem;
    font-size: .75rem; font-weight: 700; color: var(--accent);
    background: var(--accent-light); padding: .15rem .55rem; border-radius: 1rem;
  }
  .card__flip-hint {
    position: absolute; bottom: .8rem; right: 1rem;
    font-size: .7rem; color: var(--muted); opacity: .7;
  }
  .card__accent {
    height: 4px; border-radius: 2px; margin-bottom: 1rem;
    background: linear-gradient(90deg, var(--accent), var(--accent-dark));
  }

  .card__front h2 {
    font-size: 1.25rem; font-weight: 700; margin-bottom: .75rem;
    line-height: 1.35;
  }
  .card__front .prompt {
    font-size: .95rem; color: var(--muted); font-style: italic;
  }

  .card__back h3 {
    font-size: 1rem; font-weight: 700; margin-bottom: .6rem;
    color: var(--accent);
  }
  .card__back ul {
    list-style: none; padding: 0; margin: 0;
  }
  .card__back li {
    position: relative; padding: .35rem 0 .35rem 1.1rem;
    font-size: .85rem; line-height: 1.45;
    border-bottom: 1px solid var(--border);
  }
  .card__back li:last-child { border-bottom: none; }
  .card__back li::before {
    content: '▸'; position: absolute; left: 0; color: var(--accent); font-weight: 700;
  }
  .card__back strong { font-weight: 700; }

  @media (max-width: 600px) {
    .deck { grid-template-columns: 1fr; }
    .card-wrapper { height: 30rem; }
    body { padding: 1rem .5rem; }
  }
</style>
</head>
<body>
<div class="header">
  <h1>Business — Flashcards</h1>
  <p>10 cards for SWA exam revision. Click a card to flip it.</p>
</div>



<div class="controls">
  <button class="active" data-view="grid">Grid View</button>
  <button data-view="single">One at a Time</button>
  <button data-action="theme">Dark Mode</button>
  <button data-action="flip-all">Flip All</button>
</div>

<div class="counter"><span id="progress">0</span> of <span id="total">0</span> cards flipped</div>

<div class="deck" id="deck"></div>

<script>
const ALL_CARDS = [
  {
    "num": 1,
    "title": "Siemens Development System",
    "prompt": "What is the Siemens Development System and how does it guide software development at Siemens?",
    "points": [
      "<strong>SDS</strong> is Siemens' company-wide framework for product development",
      "Combines <strong>agile methods</strong> with stage-gate governance for enterprise scale",
      "<strong>Quality Gates</strong> (QG0–QG5) ensure milestone-based decision checkpoints",
      "Architects must align <strong>architecture milestones</strong> with QG deliverables",
      "<strong>SWCOE</strong> provides cross-BU standards, tools, and best practices",
      "SDS balances <strong>local team autonomy</strong> with corporate compliance needs"
    ]
  },
  {
    "num": 2,
    "title": "Cynefin Framework",
    "prompt": "How does the Cynefin framework help architects choose the right approach for a given problem?",
    "points": [
      "Five domains: <strong>Clear, Complicated, Complex, Chaotic, Confused</strong>",
      "<strong>Clear</strong>: best practice, sense-categorize-respond (standard patterns)",
      "<strong>Complicated</strong>: good practice, sense-analyze-respond (expert analysis)",
      "<strong>Complex</strong>: emergent practice, probe-sense-respond (experiments, spikes)",
      "<strong>Chaotic</strong>: novel practice, act-sense-respond (stabilize first)",
      "Architects use Cynefin to decide between <strong>upfront design vs emergent architecture</strong>"
    ]
  },
  {
    "num": 3,
    "title": "Output vs Outcome vs Impact",
    "prompt": "What is the difference between Output, Outcome, and Impact, and why does it matter for architects?",
    "points": [
      "<strong>Output</strong>: what we build (features, components, deliverables)",
      "<strong>Outcome</strong>: behavior change in users enabled by the output",
      "<strong>Impact</strong>: business-level result (revenue, market share, cost reduction)",
      "Teams often optimize for <strong>output</strong> when they should target <strong>outcome</strong>",
      "<strong>OKRs</strong> connect team objectives to measurable outcome/impact results",
      "Architects should justify decisions by <strong>expected outcome</strong>, not just technical merit"
    ]
  },
  {
    "num": 4,
    "title": "Technical Debt",
    "prompt": "How should architects manage technical debt from a business perspective?",
    "points": [
      "<strong>Cunningham's metaphor</strong>: debt = faster delivery now, interest = future cost",
      "<strong>Quadrant</strong>: Deliberate/Inadvertent × Prudent/Reckless (4 types)",
      "<strong>Prudent deliberate</strong>: conscious trade-off with documented repayment plan",
      "Debt becomes visible through <strong>velocity decline and defect rate increase</strong>",
      "Architect must <strong>quantify debt in business terms</strong> (cost, risk, timeline impact)",
      "<strong>Boy Scout Rule</strong>: leave code better than found; incremental payoff"
    ]
  },
  {
    "num": 5,
    "title": "Continuous Delivery and DORA Metrics",
    "prompt": "How do DORA metrics measure software delivery performance, and what enables Continuous Delivery?",
    "points": [
      "Four DORA metrics: <strong>Lead Time, Deploy Frequency, MTTR, Change Failure Rate</strong>",
      "<strong>Elite performers</strong>: multiple deploys/day, <1h lead time, <1h MTTR",
      "<strong>CD pipeline</strong>: commit → build → test → staging → production (automated)",
      "Architecture must support <strong>independent deployability</strong> and feature toggles",
      "<strong>Trunk-based development</strong> with short-lived branches reduces merge conflicts",
      "DORA proves <strong>speed and stability are not trade-offs</strong> — they reinforce each other"
    ]
  },
  {
    "num": 6,
    "title": "Component Teams vs Feature Teams",
    "prompt": "What are the trade-offs between component teams and feature teams?",
    "points": [
      "<strong>Component teams</strong>: own a technical layer (DB, API, UI); deep expertise",
      "<strong>Feature teams</strong>: own end-to-end delivery of a user-facing feature",
      "Component teams create <strong>handoff bottlenecks</strong> and cross-team dependencies",
      "Feature teams need <strong>broad skills</strong> but deliver value faster with less coordination",
      "<strong>Conway's Law</strong>: architecture mirrors team structure; choose teams intentionally",
      "Hybrid approach: feature teams with <strong>enabling teams</strong> for specialized expertise"
    ]
  },
  {
    "num": 7,
    "title": "Host Leadership",
    "prompt": "What is Host Leadership and how does it apply to software architects?",
    "points": [
      "<strong>Host metaphor</strong>: leader as host of a party, not commander of troops",
      "Four positions: <strong>In the Spotlight, With the Guests, In the Gallery, In the Kitchen</strong>",
      "<strong>Spotlight</strong>: set direction and vision; <strong>Gallery</strong>: observe and reflect",
      "<strong>With Guests</strong>: collaborate as equal; <strong>Kitchen</strong>: prepare behind scenes",
      "Architects shift between <strong>leading and stepping back</strong> depending on context",
      "Effective architects <strong>create space</strong> for teams to make decisions autonomously"
    ]
  },
  {
    "num": 8,
    "title": "Open Source Software at Siemens",
    "prompt": "What are the key considerations for using and contributing to OSS at Siemens?",
    "points": [
      "<strong>License compliance</strong>: permissive (MIT, Apache) vs copyleft (GPL, AGPL)",
      "<strong>AGPL</strong> requires source disclosure for network use — high risk for products",
      "Siemens uses <strong>OSS scanning tools</strong> to detect license and vulnerability issues",
      "<strong>Inner Source</strong>: applying OSS collaboration patterns within the company",
      "Architects must evaluate <strong>community health, maintenance, and security</strong> of OSS",
      "<strong>SBOM</strong> (Software Bill of Materials) tracks all OSS components in products"
    ]
  },
  {
    "num": 9,
    "title": "97 Things Every SWA Should Know",
    "prompt": "What are the key recurring themes from \\'97 Things Every Software Architect Should Know\\'?",
    "points": [
      "<strong>Simplicity</strong>: prefer the simplest solution that could possibly work",
      "<strong>Communication</strong> is more important than technical skill for architects",
      "<strong>There is no one-size-fits-all</strong> solution; context drives every decision",
      "<strong>Continuously learn</strong>: architects must stay hands-on and current",
      "<strong>Stand behind decisions</strong> and own consequences; avoid ivory tower",
      "Architecture is about <strong>trade-offs</strong>, not finding the perfect answer"
    ]
  },
  {
    "num": 10,
    "title": "Roles of PO, SM and TL within Business Understanding",
    "prompt": "How do Product Owner, Scrum Master and Technical Lead complement each other around customer value?",
    "points": [
      "<strong>PO</strong> = <strong>WHAT + WHY</strong>: customer value, backlog, priorities, acceptance criteria",
      "<strong>TL / Team Architect</strong> = <strong>HOW + consequences</strong>: options, quality attributes, risks, technical debt",
      "<strong>SM</strong> = <strong>HOW WE WORK</strong>: flow, impediments, transparency, continuous improvement",
      "Complementary responsibilities around customer value — <strong>not a hierarchy</strong>; architect maps <strong>problem space → solution space</strong>",
      "Every decision is a <strong>trade-off</strong> of value, cost, risk, quality and time",
      "Anti-patterns: PO dictates the solution, architect becomes a <strong>bottleneck</strong>, SM acts as project manager",
      "<strong>Safety-related I/O scenario</strong>: options = fast local change / targeted refactoring / limited MVP",
      "Never use a bare <strong>technical veto</strong> — present options with deadline, risk, test scope and long-term cost",
      "Fast option acceptable only with <strong>ADR, evaluated debt, backlog item and payback strategy</strong>",
      "Test strategy beyond acceptance: integration, system, <strong>fault-injection</strong> and regression tests"
    ]
  }
];
let activeCards = ALL_CARDS;
let viewMode = 'grid';
let currentIndex = 0;

const deck = document.getElementById('deck');
const progress = document.getElementById('progress');
const total = document.getElementById('total');

function renderCards() {
  deck.innerHTML = '';
  total.textContent = activeCards.length;
  const cards = viewMode === 'single' ? [activeCards[currentIndex]] : activeCards;
  cards.forEach((c, i) => {
    const idx = viewMode === 'single' ? currentIndex : i;
    const wrapper = document.createElement('div');
    wrapper.className = 'card-wrapper' + (viewMode === 'single' ? ' single-view' : '');
    wrapper.dataset.index = idx;
    wrapper.innerHTML = `
      <div class="card">
        <div class="card__face card__front">
          <span class="card__number">${c.num} / ${activeCards.length}</span>
          <div>
            <h2>${c.title}</h2>
            <p class="prompt">${c.prompt}</p>
          </div>
          <span class="card__flip-hint">click to flip</span>
        </div>
        <div class="card__face card__back">
          <div class="card__accent"></div>
          <h3>${c.title}</h3>
          <ul>${c.points.map(p => '<li>' + p + '</li>').join('')}</ul>
        </div>
      </div>`;
    wrapper.addEventListener('click', () => {
      wrapper.classList.toggle('flipped');
      updateProgress();
    });
    deck.appendChild(wrapper);
  });

  if (viewMode === 'single') {
    const nav = document.createElement('div');
    nav.style.cssText = 'display:flex;justify-content:center;gap:1rem;margin-top:1.5rem;grid-column:1/-1;';
    const len = activeCards.length;
    nav.innerHTML = `
      <button style="padding:.5rem 1.2rem;border:1px solid var(--border);border-radius:2rem;background:var(--surface);color:var(--text);cursor:pointer;font-weight:600;" id="prev">← Previous</button>
      <span style="line-height:2.2;color:var(--muted);font-size:.9rem;">${currentIndex + 1} / ${len}</span>
      <button style="padding:.5rem 1.2rem;border:1px solid var(--border);border-radius:2rem;background:var(--surface);color:var(--text);cursor:pointer;font-weight:600;" id="next">Next →</button>`;
    deck.appendChild(nav);
    document.getElementById('prev').addEventListener('click', e => { e.stopPropagation(); currentIndex = (currentIndex - 1 + len) % len; renderCards(); });
    document.getElementById('next').addEventListener('click', e => { e.stopPropagation(); currentIndex = (currentIndex + 1) % len; renderCards(); });
  }
}

function updateProgress() {
  progress.textContent = document.querySelectorAll('.card-wrapper.flipped').length;
}

document.querySelectorAll('[data-view]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-view]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    viewMode = btn.dataset.view;
    currentIndex = 0;
    renderCards();
  });
});

document.querySelector('[data-action="theme"]').addEventListener('click', function() {
  const dark = document.documentElement.dataset.theme === 'dark';
  document.documentElement.dataset.theme = dark ? '' : 'dark';
  this.textContent = dark ? 'Dark Mode' : 'Light Mode';
  localStorage.setItem('flashcard-theme', dark ? '' : 'dark');
});

document.querySelector('[data-action="flip-all"]').addEventListener('click', () => {
  const wrappers = document.querySelectorAll('.card-wrapper');
  const allFlipped = [...wrappers].every(w => w.classList.contains('flipped'));
  wrappers.forEach(w => w.classList.toggle('flipped', !allFlipped));
  updateProgress();
});

document.addEventListener('keydown', e => {
  if (viewMode !== 'single') return;
  const len = activeCards.length;
  if (e.key === 'ArrowLeft') { currentIndex = (currentIndex - 1 + len) % len; renderCards(); }
  if (e.key === 'ArrowRight') { currentIndex = (currentIndex + 1) % len; renderCards(); }
  if (e.key === ' ') { e.preventDefault(); document.querySelector('.card-wrapper')?.classList.toggle('flipped'); updateProgress(); }
});

// Tab filtering (combined page only)
document.querySelectorAll('[data-chapter]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-chapter]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const ch = btn.dataset.chapter;
    activeCards = ch === 'all' ? ALL_CARDS : ALL_CARDS.filter(c => c.chapter === ch);
    currentIndex = 0;
    renderCards();
  });
});

// Restore theme
if (localStorage.getItem('flashcard-theme') === 'dark') {
  document.documentElement.dataset.theme = 'dark';
  document.querySelector('[data-action="theme"]').textContent = 'Light Mode';
}

renderCards();
</script>
</body>
</html>
