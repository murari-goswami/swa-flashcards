<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Requirements — Flashcards</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f0f4f8; --surface: #fff; --text: #1a202c; --muted: #718096;
    --accent: #78909C; --accent-dark: #546E7A; --accent-light: #eceff1;
    --border: #e2e8f0; --flip-time: 0.5s; --radius: 1rem;
  }
  [data-theme="dark"] {
    --bg: #1a202c; --surface: #2d3748; --text: #e2e8f0; --muted: #a0aec0;
    --accent: #90a4ae; --accent-light: #37474f;
    --border: #4a5568;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    line-height: 1.6; padding: 2rem 1rem;
    transition: background .3s, color .3s;
  }

  .header {
    text-align: center; max-width: 48rem; margin: 0 auto 2.5rem;
  }
  .header h1 {
    font-size: clamp(1.5rem, 4vw, 2.2rem); font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header p { color: var(--muted); margin-top: .5rem; font-size: .95rem; }

  .tabs {
    display: flex; justify-content: center; gap: .5rem;
    flex-wrap: wrap; margin-bottom: 1.5rem;
  }
  .tabs button {
    padding: .4rem 1rem; border: 2px solid var(--border); border-radius: 2rem;
    background: var(--surface); color: var(--text); cursor: pointer;
    font-size: .8rem; font-weight: 600; transition: all .2s;
  }
  .tabs button:hover { border-color: var(--accent); color: var(--accent); }
  .tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .controls {
    display: flex; justify-content: center; gap: .75rem;
    flex-wrap: wrap; margin-bottom: 2rem;
  }
  .controls button {
    padding: .5rem 1.2rem; border: 1px solid var(--border); border-radius: 2rem;
    background: var(--surface); color: var(--text); cursor: pointer;
    font-size: .85rem; font-weight: 600; transition: all .2s;
  }
  .controls button:hover { border-color: var(--accent); color: var(--accent); }
  .controls button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .counter {
    text-align: center; color: var(--muted); font-size: .9rem; margin-bottom: 1.5rem;
  }

  .deck {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(22rem, 1fr));
    gap: 1.5rem; max-width: 74rem; margin: 0 auto; perspective: 1200px;
  }

  .card-wrapper { height: 26rem; cursor: pointer; }
  .card-wrapper.single-view { grid-column: 1 / -1; max-width: 36rem; margin: 0 auto; height: 30rem; }

  .card {
    position: relative; width: 100%; height: 100%;
    transition: transform var(--flip-time) ease;
    transform-style: preserve-3d;
  }
  .card-wrapper.flipped .card { transform: rotateY(180deg); }

  .card__face {
    position: absolute; inset: 0; backface-visibility: hidden;
    border-radius: var(--radius); padding: 1.5rem;
    display: flex; flex-direction: column;
    border: 1px solid var(--border); overflow-y: auto;
    background: var(--surface);
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
    transition: box-shadow .2s;
  }
  .card-wrapper:hover .card__face { box-shadow: 0 8px 24px rgba(0,0,0,.12); }

  .card__front { justify-content: center; align-items: center; text-align: center; }
  .card__back { transform: rotateY(180deg); }

  .card__number {
    position: absolute; top: 1rem; left: 1.2rem;
    font-size: .75rem; font-weight: 700; color: var(--accent);
    background: var(--accent-light); padding: .15rem .55rem; border-radius: 1rem;
  }
  .card__flip-hint {
    position: absolute; bottom: .8rem; right: 1rem;
    font-size: .7rem; color: var(--muted); opacity: .7;
  }
  .card__accent {
    height: 4px; border-radius: 2px; margin-bottom: 1rem;
    background: linear-gradient(90deg, var(--accent), var(--accent-dark));
  }

  .card__front h2 {
    font-size: 1.25rem; font-weight: 700; margin-bottom: .75rem;
    line-height: 1.35;
  }
  .card__front .prompt {
    font-size: .95rem; color: var(--muted); font-style: italic;
  }

  .card__back h3 {
    font-size: 1rem; font-weight: 700; margin-bottom: .6rem;
    color: var(--accent);
  }
  .card__back ul {
    list-style: none; padding: 0; margin: 0;
  }
  .card__back li {
    position: relative; padding: .35rem 0 .35rem 1.1rem;
    font-size: .85rem; line-height: 1.45;
    border-bottom: 1px solid var(--border);
  }
  .card__back li:last-child { border-bottom: none; }
  .card__back li::before {
    content: '▸'; position: absolute; left: 0; color: var(--accent); font-weight: 700;
  }
  .card__back strong { font-weight: 700; }

  @media (max-width: 600px) {
    .deck { grid-template-columns: 1fr; }
    .card-wrapper { height: 30rem; }
    body { padding: 1rem .5rem; }
  }
</style>
</head>
<body>
<div class="header">
  <h1>Requirements — Flashcards</h1>
  <p>11 cards for SWA exam revision. Click a card to flip it.</p>
</div>



<div class="controls">
  <button class="active" data-view="grid">Grid View</button>
  <button data-view="single">One at a Time</button>
  <button data-action="theme">Dark Mode</button>
  <button data-action="flip-all">Flip All</button>
</div>

<div class="counter"><span id="progress">0</span> of <span id="total">0</span> cards flipped</div>

<div class="deck" id="deck"></div>

<script>
const ALL_CARDS = [
  {
    "num": 1,
    "title": "Requirements Engineering General",
    "prompt": "What are the core activities and principles of Requirements Engineering for a software architect?",
    "points": [
      "<strong>RE activities</strong>: elicitation, documentation, validation, management",
      "<strong>Kano model</strong>: Basic (must-have), Performance (linear), Excitement (delight)",
      "<strong>Requirements</strong> describe WHAT the system must do, not HOW",
      "SWA must ensure requirements are <strong>testable and traceable</strong>",
      "<strong>Stakeholder analysis</strong> identifies who influences requirements",
      "Requirements evolve; <strong>change management</strong> process is essential"
    ]
  },
  {
    "num": 2,
    "title": "Problem vs Solution Space",
    "prompt": "How do you distinguish the Problem Space from the Solution Space in requirements?",
    "points": [
      "<strong>Problem Space</strong>: stakeholder needs, goals, and domain constraints",
      "<strong>Solution Space</strong>: technical design, architecture, implementation choices",
      "Mixing spaces leads to <strong>premature design decisions</strong> in requirements",
      "<strong>Twin Peaks</strong> model: requirements and architecture co-evolve iteratively",
      "SWA bridges both spaces via <strong>ASR identification</strong> and trade-off analysis",
      "Domain model belongs to <strong>Problem Space</strong>; deployment model to Solution Space"
    ]
  },
  {
    "num": 3,
    "title": "Classification of Requirements",
    "prompt": "How are requirements classified into functional and non-functional categories?",
    "points": [
      "<strong>Functional</strong>: what the system does (features, business rules, data)",
      "<strong>Non-functional (quality)</strong>: how well the system performs (ISO 25010)",
      "<strong>Constraints</strong>: mandatory boundaries (technology, legal, organizational)",
      "<strong>ISO 25010</strong> qualities: reliability, security, maintainability, performance, etc.",
      "NFRs are <strong>architecturally significant</strong> — they shape design decisions",
      "Each NFR needs a <strong>measurable quality scenario</strong> for testability"
    ]
  },
  {
    "num": 4,
    "title": "SWA Goals in Requirements Engineering",
    "prompt": "What are the architect\\'s specific goals and responsibilities in RE?",
    "points": [
      "Identify <strong>Architecturally Significant Requirements (ASR)</strong> early",
      "Ensure NFRs are <strong>specific, measurable, and testable</strong> (quality scenarios)",
      "Challenge requirements that are <strong>contradictory or technically infeasible</strong>",
      "<strong>Utility Tree</strong> prioritizes ASRs by business value and architectural risk",
      "SWA participates in <strong>requirements reviews</strong> and validation workshops",
      "Bridge between <strong>stakeholder needs</strong> and <strong>technical feasibility</strong>"
    ]
  },
  {
    "num": 5,
    "title": "Requirement Elicitation",
    "prompt": "What techniques are used to elicit requirements, and what are their trade-offs?",
    "points": [
      "<strong>Interviews</strong>: deep insight but time-intensive and interviewer-biased",
      "<strong>Workshops</strong> (e.g., JAD): collaborative, fast consensus, but expensive to organize",
      "<strong>Prototyping</strong>: validates UI/UX early; risk of <strong>anchoring</strong> on prototype",
      "<strong>Observation</strong> (ethnography): reveals tacit knowledge users cannot articulate",
      "<strong>Document analysis</strong>: leverages existing specs but may be outdated",
      "<strong>Questionnaires</strong>: scalable for large groups but low-depth responses",
      "SWA focuses on eliciting <strong>quality attributes and constraints</strong>"
    ]
  },
  {
    "num": 6,
    "title": "Requirement Consolidation",
    "prompt": "How are elicited requirements consolidated into a coherent, conflict-free set?",
    "points": [
      "<strong>Consolidation</strong> merges, deduplicates, and resolves requirement conflicts",
      "<strong>Conflict types</strong>: contradictions, redundancies, ambiguities, gaps",
      "<strong>Prioritization</strong> techniques: MoSCoW, Kano, Weighted Scoring, Cost of Delay",
      "<strong>Negotiation</strong> with stakeholders when trade-offs are unavoidable",
      "<strong>Traceability matrix</strong> links requirements to sources and tests",
      "SWA ensures <strong>architectural consistency</strong> across consolidated requirements"
    ]
  },
  {
    "num": 7,
    "title": "Requirement Analysis",
    "prompt": "How does requirement analysis ensure quality, feasibility, and architectural alignment?",
    "points": [
      "<strong>Analysis</strong> checks completeness, consistency, feasibility, and testability",
      "<strong>Impact analysis</strong> evaluates how new requirements affect existing architecture",
      "<strong>Feasibility study</strong>: technical risk, cost, and timeline assessment",
      "<strong>Modeling</strong> techniques: use cases, user stories, domain models, state diagrams",
      "<strong>Acceptance criteria</strong> must be defined for every requirement",
      "SWA validates that NFRs are <strong>architecturally achievable</strong> with chosen tactics"
    ]
  },
  {
    "num": 8,
    "title": "Requirements Pyramid",
    "prompt": "What is the Requirements Pyramid and how do abstraction levels relate?",
    "points": [
      "<strong>Pyramid levels</strong>: Business Goals → Features → Use Cases → User Stories → Tasks",
      "Each level adds <strong>detail and testability</strong>; higher levels are more stable",
      "<strong>Epics</strong> decompose into stories; stories into <strong>acceptance criteria</strong>",
      "<strong>INVEST</strong> criteria for good user stories: Independent, Negotiable, Valuable, Estimable, Small, Testable",
      "SWA works primarily at <strong>Feature and Use Case</strong> levels for ASR identification",
      "<strong>Vertical slicing</strong> delivers value across all architecture layers per story"
    ]
  },
  {
    "num": 9,
    "title": "Definition of Done vs Definition of Ready",
    "prompt": "How do DoD and DoR ensure quality gates in agile requirements management?",
    "points": [
      "<strong>DoR</strong>: checklist before a story enters a sprint (clear, estimated, testable)",
      "<strong>DoD</strong>: checklist before a story is considered complete (coded, tested, reviewed)",
      "DoR prevents <strong>incomplete requirements</strong> from entering development",
      "DoD ensures <strong>consistent quality</strong> across all delivered increments",
      "SWA adds architectural criteria: <strong>ADR written, NFRs validated, no new debt</strong>",
      "Both evolve over time as the team <strong>matures and learns</strong>"
    ]
  },
  {
    "num": 10,
    "title": "FURPS+ and Non-Functional Requirements",
    "prompt": "What is the FURPS+ model and how does it structure non-functional requirements?",
    "points": [
      "<strong>FURPS+</strong>: Functionality, Usability, Reliability, Performance, Supportability",
      "<strong>+</strong> adds: Design, Implementation, Interface, Physical constraints",
      "Each quality must have <strong>measurable acceptance criteria</strong> (response time < 200ms)",
      "<strong>Quality scenarios</strong> (SEI format) make NFRs testable and unambiguous",
      "NFRs drive <strong>architectural decisions</strong> more than functional requirements",
      "Trade-offs between qualities require <strong>explicit stakeholder agreement</strong>"
    ]
  },
  {
    "num": 11,
    "title": "Role of SWA and Quality Attributes",
    "prompt": "How does the software architect translate quality attributes into architectural decisions?",
    "points": [
      "SWA is the <strong>guardian of quality attributes</strong> across the system lifecycle",
      "<strong>ATAM</strong> evaluates architecture against quality attribute scenarios",
      "<strong>Sensitivity points</strong>: decisions affecting one quality attribute significantly",
      "<strong>Trade-off points</strong>: decisions affecting multiple qualities in opposing directions",
      "<strong>Risks</strong> and <strong>non-risks</strong> documented for stakeholder transparency",
      "Quality attributes must be <strong>prioritized</strong> — you cannot optimize all equally"
    ]
  }
];
let activeCards = ALL_CARDS;
let viewMode = 'grid';
let currentIndex = 0;

const deck = document.getElementById('deck');
const progress = document.getElementById('progress');
const total = document.getElementById('total');

function renderCards() {
  deck.innerHTML = '';
  total.textContent = activeCards.length;
  const cards = viewMode === 'single' ? [activeCards[currentIndex]] : activeCards;
  cards.forEach((c, i) => {
    const idx = viewMode === 'single' ? currentIndex : i;
    const wrapper = document.createElement('div');
    wrapper.className = 'card-wrapper' + (viewMode === 'single' ? ' single-view' : '');
    wrapper.dataset.index = idx;
    wrapper.innerHTML = `
      <div class="card">
        <div class="card__face card__front">
          <span class="card__number">${c.num} / ${activeCards.length}</span>
          <div>
            <h2>${c.title}</h2>
            <p class="prompt">${c.prompt}</p>
          </div>
          <span class="card__flip-hint">click to flip</span>
        </div>
        <div class="card__face card__back">
          <div class="card__accent"></div>
          <h3>${c.title}</h3>
          <ul>${c.points.map(p => '<li>' + p + '</li>').join('')}</ul>
        </div>
      </div>`;
    wrapper.addEventListener('click', () => {
      wrapper.classList.toggle('flipped');
      updateProgress();
    });
    deck.appendChild(wrapper);
  });

  if (viewMode === 'single') {
    const nav = document.createElement('div');
    nav.style.cssText = 'display:flex;justify-content:center;gap:1rem;margin-top:1.5rem;grid-column:1/-1;';
    const len = activeCards.length;
    nav.innerHTML = `
      <button style="padding:.5rem 1.2rem;border:1px solid var(--border);border-radius:2rem;background:var(--surface);color:var(--text);cursor:pointer;font-weight:600;" id="prev">← Previous</button>
      <span style="line-height:2.2;color:var(--muted);font-size:.9rem;">${currentIndex + 1} / ${len}</span>
      <button style="padding:.5rem 1.2rem;border:1px solid var(--border);border-radius:2rem;background:var(--surface);color:var(--text);cursor:pointer;font-weight:600;" id="next">Next →</button>`;
    deck.appendChild(nav);
    document.getElementById('prev').addEventListener('click', e => { e.stopPropagation(); currentIndex = (currentIndex - 1 + len) % len; renderCards(); });
    document.getElementById('next').addEventListener('click', e => { e.stopPropagation(); currentIndex = (currentIndex + 1) % len; renderCards(); });
  }
}

function updateProgress() {
  progress.textContent = document.querySelectorAll('.card-wrapper.flipped').length;
}

document.querySelectorAll('[data-view]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-view]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    viewMode = btn.dataset.view;
    currentIndex = 0;
    renderCards();
  });
});

document.querySelector('[data-action="theme"]').addEventListener('click', function() {
  const dark = document.documentElement.dataset.theme === 'dark';
  document.documentElement.dataset.theme = dark ? '' : 'dark';
  this.textContent = dark ? 'Dark Mode' : 'Light Mode';
  localStorage.setItem('flashcard-theme', dark ? '' : 'dark');
});

document.querySelector('[data-action="flip-all"]').addEventListener('click', () => {
  const wrappers = document.querySelectorAll('.card-wrapper');
  const allFlipped = [...wrappers].every(w => w.classList.contains('flipped'));
  wrappers.forEach(w => w.classList.toggle('flipped', !allFlipped));
  updateProgress();
});

document.addEventListener('keydown', e => {
  if (viewMode !== 'single') return;
  const len = activeCards.length;
  if (e.key === 'ArrowLeft') { currentIndex = (currentIndex - 1 + len) % len; renderCards(); }
  if (e.key === 'ArrowRight') { currentIndex = (currentIndex + 1) % len; renderCards(); }
  if (e.key === ' ') { e.preventDefault(); document.querySelector('.card-wrapper')?.classList.toggle('flipped'); updateProgress(); }
});

// Tab filtering (combined page only)
document.querySelectorAll('[data-chapter]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-chapter]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const ch = btn.dataset.chapter;
    activeCards = ch === 'all' ? ALL_CARDS : ALL_CARDS.filter(c => c.chapter === ch);
    currentIndex = 0;
    renderCards();
  });
});

// Restore theme
if (localStorage.getItem('flashcard-theme') === 'dark') {
  document.documentElement.dataset.theme = 'dark';
  document.querySelector('[data-action="theme"]').textContent = 'Light Mode';
}

renderCards();
</script>
</body>
</html>
